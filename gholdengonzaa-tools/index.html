<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GholdenGonzaa | Enlaces Oficiales</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Enlaces oficiales de GholdenGonzaa. Pokémon Champions VGC, YouTube, Discord y Patreon.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Core Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            background-image: radial-gradient(circle at 50% 0%, var(--surface-1), var(--bg-color) 70%);
        }
        
        .linktree-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .profile-section {
            margin-bottom: 2.5rem;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--gold);
            box-shadow: 0 0 20px rgba(212, 160, 23, 0.3);
            margin-bottom: 1rem;
        }

        .profile-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: var(--white);
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .profile-bio {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1.2rem;
            background: var(--surface-1);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: var(--surface-2);
            border-color: var(--gold);
            box-shadow: 0 5px 15px rgba(212, 160, 23, 0.15);
            color: var(--gold);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--gold);
            transform: scaleY(0);
            transition: transform 0.2s ease;
            transform-origin: bottom;
        }

        .link-card:hover::before {
            transform: scaleY(1);
        }
        
        .link-card-special {
            background: linear-gradient(135deg, rgba(212, 160, 23, 0.15) 0%, rgba(212, 160, 23, 0.05) 100%);
            border-color: rgba(212, 160, 23, 0.4);
            margin-top: 1rem;
        }
        
        .link-card-special:hover {
            background: linear-gradient(135deg, rgba(212, 160, 23, 0.25) 0%, rgba(212, 160, 23, 0.1) 100%);
        }

        .icon {
            font-size: 1.4rem;
            margin-right: 10px;
        }

        /* Accordion de herramientas */
        .tools-toggle {
            cursor: pointer;
            user-select: none;
        }
        .tools-toggle .arrow {
            margin-left: auto;
            transition: transform 0.2s ease;
            font-size: 0.8rem;
        }
        .tools-toggle.open .arrow {
            transform: rotate(180deg);
        }
        .tools-submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-left: 1.5rem;
        }
        .tools-submenu.open {
            max-height: 400px;
            margin-top: 0.5rem;
        }
        .tools-submenu .link-card {
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            background: var(--surface-2);
            border-color: transparent;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="linktree-container">
        
        <div class="profile-section">
            <!-- Podes cambiar esta imagen por otra si preferís -->
            <img src="assets/logo.png" alt="GholdenGonzaa" class="profile-img">
            <h1 class="profile-name">GHOLDENGONZAA</h1>
            <p class="profile-bio">Pokémon Champions VGC | Herramientas y Meta 🏆</p>
        </div>

        <div class="links-wrapper">
            
            <div class="link-card tools-toggle" onclick="this.classList.toggle('open'); document.getElementById('toolsMenu').classList.toggle('open');">
                <span class="icon">🛠️</span> GholdenGonzaa Tools
                <span class="arrow">▼</span>
            </div>
            <div id="toolsMenu" class="tools-submenu">
                <a href="tierlist.html" class="link-card">📊 Tier List</a>
                <a href="speed-calc.html" class="link-card">⚡ Speed Tiers</a>
                <a href="counters.html" class="link-card">🎯 Counters</a>
                <a href="teambuilder.html" class="link-card">🧩 Team Builder</a>
            </div>
            
            <a href="https://www.youtube.com/channel/UCk_cRnqOCeWTSwmQooW19sA" target="_blank" rel="noopener noreferrer" class="link-card">
                <span class="icon">🎬</span> Canal de YouTube
            </a>

            <a href="https://www.instagram.com/gholdengonzaa/" target="_blank" rel="noopener noreferrer" class="link-card">
                <span class="icon">📸</span> Instagram
            </a>

            <a href="https://www.tiktok.com/@gholdengonzaa" target="_blank" rel="noopener noreferrer" class="link-card">
                <span class="icon">🎵</span> TikTok
            </a>

            <a href="https://discord.gg/K52eDVeh" target="_blank" rel="noopener noreferrer" class="link-card">
                <span class="icon">💬</span> Comunidad en Discord
            </a>

            <a href="https://www.patreon.com/15868000/join" target="_blank" rel="noopener noreferrer" class="link-card">
                <span class="icon">⭐</span> Apóyame en Patreon
            </a>

            <a href="mailto:msqgonzaa@gmail.com" class="link-card link-card-special">
                <span class="icon">💼</span> Contrataciones y Negocios
            </a>

        </div>

    </div>

</body>
</html>
